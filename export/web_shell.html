<!DOCTYPE html>
<html lang="zh-CN">
	<head>
		<meta charset="utf-8">
		<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
		<meta name="mobile-web-app-capable" content="yes">
		<meta name="apple-mobile-web-app-capable" content="yes">
		<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
		<meta name="screen-orientation" content="landscape">
		<title>$GODOT_PROJECT_NAME</title>
		<style>
html, body {
	margin: 0;
	padding: 0;
	border: 0;
	width: 100%;
	height: 100%;
	width: 100dvw;
	height: 100dvh;
	overflow: hidden;
	touch-action: none;
	background-color: #000;
	color: #f5ead6;
}

body {
	position: fixed;
	inset: 0;
}

#canvas {
	display: block;
	width: 100%;
	height: 100%;
	outline: none;
	touch-action: none;
	image-rendering: -moz-crisp-edges;
	image-rendering: -webkit-optimize-contrast;
	image-rendering: pixelated;
}

#canvas:focus {
	outline: none;
}

#rotate-hint {
	position: fixed;
	inset: 0;
	z-index: 99999;
	display: none;
	flex-direction: column;
	align-items: center;
	justify-content: center;
	background: #1a1410;
	color: #f5ead6;
	font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
	text-align: center;
	padding: 24px;
	box-sizing: border-box;
}

#rotate-hint .icon {
	font-size: 56px;
	line-height: 1;
	margin-bottom: 16px;
	animation: hekesong-rotate 2s ease-in-out infinite;
}

#rotate-hint h1 {
	margin: 0 0 8px;
	font-size: 22px;
	font-weight: 600;
}

#rotate-hint p {
	margin: 0;
	opacity: 0.75;
	font-size: 14px;
}

@keyframes hekesong-rotate {
	0%, 100% { transform: rotate(0deg); }
	50% { transform: rotate(90deg); }
}

#status, #status-splash, #status-progress {
	position: absolute;
	left: 0;
	right: 0;
}

#status, #status-splash {
	top: 0;
	bottom: 0;
}

#status {
	background-color: $GODOT_SPLASH_COLOR;
	display: flex;
	flex-direction: column;
	justify-content: center;
	align-items: center;
	visibility: hidden;
}

#status-splash {
	max-height: 100%;
	max-width: 100%;
	margin: auto;
}

#status-splash.show-image--false {
	display: none;
}

#status-splash.fullsize--true {
	height: 100%;
	width: 100%;
	object-fit: contain;
}

#status-splash.use-filter--false {
	image-rendering: pixelated;
}

#status-progress, #status-notice {
	display: none;
}

#status-progress {
	bottom: 10%;
	width: 50%;
	margin: 0 auto;
}

#status-notice {
	background-color: #5b3943;
	border-radius: 0.5rem;
	border: 1px solid #9b3943;
	color: #e0e0e0;
	font-family: 'Noto Sans', 'Droid Sans', Arial, sans-serif;
	line-height: 1.3;
	margin: 0 2rem;
	overflow: hidden;
	padding: 1rem;
	text-align: center;
	z-index: 1;
}
		</style>
		$GODOT_HEAD_INCLUDE
	</head>
	<body>
		<div id="rotate-hint" aria-live="polite">
			<div class="icon" aria-hidden="true">📱</div>
			<h1>请旋转手机至横屏</h1>
			<p>Landscape mode · 横屏后可全屏游玩</p>
		</div>

		<canvas id="canvas">
			Your browser does not support the canvas tag.
		</canvas>

		<noscript>
			Your browser does not support JavaScript.
		</noscript>

		<div id="status">
			<img id="status-splash" class="$GODOT_SPLASH_CLASSES" src="$GODOT_SPLASH" alt="">
			<progress id="status-progress"></progress>
			<div id="status-notice"></div>
		</div>

		<script src="$GODOT_URL"></script>
		<script>
(function capWebPixelRatio() {
	const raw = Number(window.devicePixelRatio) || 1;
	const narrow = Math.min(window.innerWidth, window.innerHeight) < 900;
	const maxRatio = narrow ? 1.5 : 2;
	const capped = Math.min(Math.max(raw, 1), maxRatio);
	if (capped === raw) {
		return;
	}
	try {
		Object.defineProperty(window, 'devicePixelRatio', {
			configurable: true,
			get: function () { return capped; },
		});
	} catch (e) {}
})();

function hekesongIsMobilePortrait() {
	const narrow = Math.min(window.innerWidth, window.innerHeight) < 900;
	return narrow && window.matchMedia('(orientation: portrait)').matches;
}

function hekesongSyncMobileLayout() {
	const portrait = hekesongIsMobilePortrait();
	const hint = document.getElementById('rotate-hint');
	const canvas = document.getElementById('canvas');
	if (hint) {
		hint.style.display = portrait ? 'flex' : 'none';
	}
	if (canvas) {
		canvas.style.visibility = portrait ? 'hidden' : 'visible';
	}
	if (!portrait) {
		window.dispatchEvent(new Event('resize'));
	}
}

function hekesongTryLockLandscape() {
	try {
		const o = screen.orientation;
		if (o && o.lock) {
			o.lock('landscape').catch(function () {});
		}
	} catch (e) {}
}

window.addEventListener('resize', hekesongSyncMobileLayout);
window.addEventListener('orientationchange', function () {
	setTimeout(hekesongSyncMobileLayout, 200);
});
document.addEventListener('DOMContentLoaded', hekesongSyncMobileLayout);
document.addEventListener('pointerdown', hekesongTryLockLandscape, { once: true });

const GODOT_CONFIG = $GODOT_CONFIG;
const GODOT_THREADS_ENABLED = $GODOT_THREADS_ENABLED;
const engine = new Engine(GODOT_CONFIG);

(function () {
	const statusOverlay = document.getElementById('status');
	const statusProgress = document.getElementById('status-progress');
	const statusNotice = document.getElementById('status-notice');

	let initializing = true;
	let statusMode = '';

	function setStatusMode(mode) {
		if (statusMode === mode || !initializing) {
			return;
		}
		if (mode === 'hidden') {
			statusOverlay.remove();
			initializing = false;
			hekesongSyncMobileLayout();
			return;
		}
		statusOverlay.style.visibility = 'visible';
		statusProgress.style.display = mode === 'progress' ? 'block' : 'none';
		statusNotice.style.display = mode === 'notice' ? 'block' : 'none';
		statusMode = mode;
	}

	function setStatusNotice(text) {
		while (statusNotice.lastChild) {
			statusNotice.removeChild(statusNotice.lastChild);
		}
		const lines = text.split('\n');
		lines.forEach((line) => {
			statusNotice.appendChild(document.createTextNode(line));
			statusNotice.appendChild(document.createElement('br'));
		});
	}

	function displayFailureNotice(err) {
		console.error(err);
		if (err instanceof Error) {
			setStatusNotice(err.message);
		} else if (typeof err === 'string') {
			setStatusNotice(err);
		} else {
			setStatusNotice('An unknown error occurred.');
		}
		setStatusMode('notice');
		initializing = false;
	}

	const missing = Engine.getMissingFeatures({
		threads: GODOT_THREADS_ENABLED,
	});

	if (missing.length !== 0) {
		if (GODOT_CONFIG['serviceWorker'] && GODOT_CONFIG['ensureCrossOriginIsolationHeaders'] && 'serviceWorker' in navigator) {
			let serviceWorkerRegistrationPromise;
			try {
				serviceWorkerRegistrationPromise = navigator.serviceWorker.getRegistration();
			} catch (err) {
				serviceWorkerRegistrationPromise = Promise.reject(new Error('Service worker registration failed.'));
			}
			Promise.race([
				serviceWorkerRegistrationPromise.then((registration) => {
					if (registration != null) {
						return Promise.reject(new Error('Service worker already exists.'));
					}
					return registration;
				}).then(() => engine.installServiceWorker()),
				new Promise((resolve) => {
					setTimeout(() => resolve(), 2000);
				}),
			]).then(() => {
				window.location.reload();
			}).catch((err) => {
				console.error('Error while registering service worker:', err);
			});
		} else {
			const missingMsg = 'Error\nThe following features required to run Godot projects on the Web are missing:\n';
			displayFailureNotice(missingMsg + missing.join('\n'));
		}
	} else {
		setStatusMode('progress');
		engine.startGame({
			'onProgress': function (current, total) {
				if (current > 0 && total > 0) {
					statusProgress.value = current;
					statusProgress.max = total;
				} else {
					statusProgress.removeAttribute('value');
					statusProgress.removeAttribute('max');
				}
			},
		}).then(() => {
			setStatusMode('hidden');
		}, displayFailureNotice);
	}
}());
		</script>
	</body>
</html>
